<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="410" fill="#ffffff"/><text x="40" y="34" class="title" text-anchor="start">图 5  AHT20 一次读出的 7 个字节：40 位数据怎么拼成温度与湿度</text><text x="40" y="58" class="s" text-anchor="start">状态字 1 字节 + 数据 5 字节 + CRC8 1 字节。湿度占 20 位、温度占 20 位，在第三个字节处「咬合」在一起。</text><rect x="56" y="100" width="122" height="82" rx="5" ry="5" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/><text x="64" y="119" class="s" text-anchor="start" fill="#57606a" font-weight="600">B0</text><text x="117.0" y="146" class="s" text-anchor="middle" fill="#57606a" font-weight="600">状态字</text><text x="117.0" y="175" class="xs" text-anchor="middle">忙 / 校准位</text><rect x="186" y="100" width="122" height="82" rx="5" ry="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/><text x="194" y="119" class="s" text-anchor="start" fill="#1a7f37" font-weight="600">B1</text><text x="247.0" y="146" class="s" text-anchor="middle" fill="#1a7f37" font-weight="600">湿度[19:12]</text><text x="247.0" y="175" class="xs" text-anchor="middle">高 8 位</text><rect x="316" y="100" width="122" height="82" rx="5" ry="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/><text x="324" y="119" class="s" text-anchor="start" fill="#1a7f37" font-weight="600">B2</text><text x="377.0" y="146" class="s" text-anchor="middle" fill="#1a7f37" font-weight="600">湿度[11:4]</text><text x="377.0" y="175" class="xs" text-anchor="middle">中 8 位</text><rect x="446" y="100" width="122" height="82" rx="5" ry="5" fill="#fdf3d0" stroke="#bc4c00" stroke-width="1.3"/><text x="454" y="119" class="s" text-anchor="start" fill="#bc4c00" font-weight="600">B3</text><text x="507.0" y="138" class="xs" text-anchor="middle" fill="#bc4c00" font-weight="600">湿度[3:0]</text><text x="507.0" y="158" class="xs" text-anchor="middle" fill="#bc4c00" font-weight="600">温度[19:16]</text><text x="507.0" y="175" class="xs" text-anchor="middle">两段共用</text><rect x="576" y="100" width="122" height="82" rx="5" ry="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/><text x="584" y="119" class="s" text-anchor="start" fill="#bc4c00" font-weight="600">B4</text><text x="637.0" y="146" class="s" text-anchor="middle" fill="#bc4c00" font-weight="600">温度[15:8]</text><text x="637.0" y="175" class="xs" text-anchor="middle">中 8 位</text><rect x="706" y="100" width="122" height="82" rx="5" ry="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/><text x="714" y="119" class="s" text-anchor="start" fill="#bc4c00" font-weight="600">B5</text><text x="767.0" y="146" class="s" text-anchor="middle" fill="#bc4c00" font-weight="600">温度[7:0]</text><text x="767.0" y="175" class="xs" text-anchor="middle">低 8 位</text><rect x="836" y="100" width="122" height="82" rx="5" ry="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/><text x="844" y="119" class="s" text-anchor="start" fill="#0969da" font-weight="600">B6</text><text x="897.0" y="146" class="s" text-anchor="middle" fill="#0969da" font-weight="600">CRC8</text><text x="897.0" y="175" class="xs" text-anchor="middle">可选校验</text><text x="56" y="210" class="l" text-anchor="start" fill="#1a7f37" font-weight="600">湿度（20 位）</text><rect x="56" y="222" width="122" height="26" rx="3" ry="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="117" y="240" class="m" text-anchor="middle" fill="#1a7f37">B1 &lt;&lt; 12</text><rect x="186" y="222" width="122" height="26" rx="3" ry="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="247" y="240" class="m" text-anchor="middle" fill="#1a7f37">B2 &lt;&lt; 4</text><rect x="316" y="222" width="122" height="26" rx="3" ry="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="377" y="240" class="m" text-anchor="middle" fill="#1a7f37">B3 &gt;&gt; 4</text><text x="454" y="240" class="m" text-anchor="start" fill="#1a7f37">→  raw_h ∈ [0, 2²⁰)</text><text x="620" y="240" class="m" text-anchor="start" fill="#1a7f37" font-weight="600">RH = raw_h / 2²⁰ × 100   (%RH)</text><text x="56" y="278" class="l" text-anchor="start" fill="#bc4c00" font-weight="600">温度（20 位）</text><rect x="56" y="290" width="122" height="26" rx="3" ry="3" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/><text x="117" y="308" class="xs" text-anchor="middle" fill="#bc4c00">(B3&amp;0x0F) &lt;&lt; 16</text><rect x="186" y="290" width="122" height="26" rx="3" ry="3" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/><text x="247" y="308" class="m" text-anchor="middle" fill="#bc4c00">B4 &lt;&lt; 8</text><rect x="316" y="290" width="122" height="26" rx="3" ry="3" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/><text x="377" y="308" class="m" text-anchor="middle" fill="#bc4c00">B5</text><text x="454" y="308" class="m" text-anchor="start" fill="#bc4c00">→  raw_t ∈ [0, 2²⁰)</text><text x="620" y="308" class="m" text-anchor="start" fill="#bc4c00" font-weight="600">T = raw_t / 2²⁰ × 200 − 50   (℃)</text><text x="56" y="348" class="s" text-anchor="start" font-weight="600">举例（RH=55.20 %RH, T=26.35 ℃）：B1..B6 = 8D 4F E6 1B A6 + CRC</text><text x="56" y="368" class="s" text-anchor="start" fill="#57606a">raw_h = 0x8D4FE = 578814 → 55.20 %RH ；raw_t = 0x61BA6 = 400294 → 26.35 ℃</text><text x="56" y="392" class="s" text-anchor="start" fill="#cf222e">注意：B6 = 0xFF 是部分模块「不发 CRC」的占位值，此时跳过校验，否则会一直报 CRC 错。</text></svg>