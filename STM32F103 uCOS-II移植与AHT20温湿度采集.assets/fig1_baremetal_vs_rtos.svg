<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="572" fill="#ffffff"/><defs><marker id="a1f2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker></defs><text x="40" y="34" class="title" text-anchor="start">图 1  裸机死循环延时 与 RTOS 周期任务：CPU 时间到底花在哪</text><text x="40" y="58" class="s" text-anchor="start">两者代码看起来都是「等待」，区别在于等待期间 CPU 是被占死，还是能去干别的。</text><rect x="30" y="72" width="940" height="182" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="48" y="96" class="l" text-anchor="start" font-weight="600">① 裸机（前后台系统）：一个 while(1) 里串行执行</text><rect x="96.0" y="118" width="78.4" height="54" rx="4" ry="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/><text x="135.2" y="142" class="s" text-anchor="middle" fill="#cf222e" font-weight="600">LED1 亮</text><text x="135.2" y="160" class="s" text-anchor="middle" fill="#cf222e">死等 1 s</text><rect x="176.4" y="118" width="78.4" height="54" rx="4" ry="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/><text x="215.60000000000002" y="142" class="s" text-anchor="middle" fill="#cf222e" font-weight="600">LED1 灭</text><text x="215.60000000000002" y="160" class="s" text-anchor="middle" fill="#cf222e">死等 1 s</text><rect x="256.8" y="118" width="239.20000000000002" height="54" rx="4" ry="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/><text x="376.40000000000003" y="142" class="s" text-anchor="middle" fill="#bc4c00" font-weight="600">LED2 亮</text><text x="376.40000000000003" y="160" class="s" text-anchor="middle" fill="#bc4c00">死等 3 s</text><rect x="498.0" y="118" width="239.20000000000002" height="54" rx="4" ry="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/><text x="617.6" y="142" class="s" text-anchor="middle" fill="#bc4c00" font-weight="600">LED2 灭</text><text x="617.6" y="160" class="s" text-anchor="middle" fill="#bc4c00">死等 3 s</text><rect x="739.2" y="118" width="158.8" height="54" rx="4" ry="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="818.6" y="142" class="s" text-anchor="middle" fill="#0969da" font-weight="600">串口发送</text><text x="818.6" y="160" class="s" text-anchor="middle" fill="#0969da">在本轮最后</text><line x1="96.0" y1="172" x2="96.0" y2="180" stroke="#57606a" stroke-width="1"/><text x="96.0" y="194" class="s" text-anchor="middle">0</text><line x1="176.4" y1="172" x2="176.4" y2="180" stroke="#57606a" stroke-width="1"/><text x="176.4" y="194" class="s" text-anchor="middle">1</text><line x1="256.8" y1="172" x2="256.8" y2="180" stroke="#57606a" stroke-width="1"/><text x="256.8" y="194" class="s" text-anchor="middle">2</text><line x1="337.20000000000005" y1="172" x2="337.20000000000005" y2="180" stroke="#57606a" stroke-width="1"/><text x="337.20000000000005" y="194" class="s" text-anchor="middle">3</text><line x1="417.6" y1="172" x2="417.6" y2="180" stroke="#57606a" stroke-width="1"/><text x="417.6" y="194" class="s" text-anchor="middle">4</text><line x1="498.0" y1="172" x2="498.0" y2="180" stroke="#57606a" stroke-width="1"/><text x="498.0" y="194" class="s" text-anchor="middle">5</text><line x1="578.4000000000001" y1="172" x2="578.4000000000001" y2="180" stroke="#57606a" stroke-width="1"/><text x="578.4000000000001" y="194" class="s" text-anchor="middle">6</text><line x1="658.8000000000001" y1="172" x2="658.8000000000001" y2="180" stroke="#57606a" stroke-width="1"/><text x="658.8000000000001" y="194" class="s" text-anchor="middle">7</text><line x1="739.2" y1="172" x2="739.2" y2="180" stroke="#57606a" stroke-width="1"/><text x="739.2" y="194" class="s" text-anchor="middle">8</text><line x1="819.6" y1="172" x2="819.6" y2="180" stroke="#57606a" stroke-width="1"/><text x="819.6" y="194" class="s" text-anchor="middle">9</text><line x1="900.0" y1="172" x2="900.0" y2="180" stroke="#57606a" stroke-width="1"/><text x="900.0" y="194" class="s" text-anchor="middle">10</text><text x="914" y="212" class="s" text-anchor="start">时间 / s</text><text x="48" y="224" class="s" text-anchor="start">一圈 10 s：串口那句 hello 必须等两个 LED 任务「死等」结束，实测周期永远是 10 s 的整数倍。</text><text x="48" y="244" class="s" text-anchor="start" fill="#cf222e">「等待」期间 CPU 在空转跑 for 循环 —— 三个功能互相拖累，这就是前后台系统的天花板。</text><rect x="30" y="272" width="940" height="262" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="48" y="296" class="l" text-anchor="start" font-weight="600">② RTOS：三个任务各自按周期就绪，OSTimeDly() 一调用 CPU 立刻让出来</text><text x="140" y="339" class="s" text-anchor="end" fill="#1a7f37" font-weight="600">led1_task  1 s</text><line x1="150" y1="334" x2="930" y2="334" stroke="#d0d7de" stroke-width="1"/><line x1="150.0" y1="322" x2="150.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="150.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="280.0" y1="322" x2="280.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="280.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="410.0" y1="322" x2="410.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="410.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="540.0" y1="322" x2="540.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="540.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="670.0" y1="322" x2="670.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="670.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="800.0" y1="322" x2="800.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="800.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="930.0" y1="322" x2="930.0" y2="346" stroke="#1a7f37" stroke-width="1"/><rect x="930.0" y="326" width="7" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><text x="140" y="383" class="s" text-anchor="end" fill="#bc4c00" font-weight="600">led2_task  3 s</text><line x1="150" y1="378" x2="930" y2="378" stroke="#d0d7de" stroke-width="1"/><line x1="150.0" y1="366" x2="150.0" y2="390" stroke="#bc4c00" stroke-width="1"/><rect x="150.0" y="370" width="7" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><line x1="540.0" y1="366" x2="540.0" y2="390" stroke="#bc4c00" stroke-width="1"/><rect x="540.0" y="370" width="7" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><line x1="930.0" y1="366" x2="930.0" y2="390" stroke="#bc4c00" stroke-width="1"/><rect x="930.0" y="370" width="7" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><text x="140" y="427" class="s" text-anchor="end" fill="#0969da" font-weight="600">uart_task  2 s</text><line x1="150" y1="422" x2="930" y2="422" stroke="#d0d7de" stroke-width="1"/><line x1="150.0" y1="410" x2="150.0" y2="434" stroke="#0969da" stroke-width="1"/><rect x="150.0" y="414" width="7" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="410.0" y1="410" x2="410.0" y2="434" stroke="#0969da" stroke-width="1"/><rect x="410.0" y="414" width="7" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="670.0" y1="410" x2="670.0" y2="434" stroke="#0969da" stroke-width="1"/><rect x="670.0" y="414" width="7" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="930.0" y1="410" x2="930.0" y2="434" stroke="#0969da" stroke-width="1"/><rect x="930.0" y="414" width="7" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><text x="140" y="471" class="s" text-anchor="end" fill="#57606a">空闲任务</text><rect x="150" y="456" width="780" height="20" rx="3" ry="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/><text x="540.0" y="470" class="s" text-anchor="middle">没任务就绪时才轮到它 —— 它老是没机会跑，说明调度没崩</text><line x1="150.0" y1="452" x2="150.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="150.0" y="496" class="s" text-anchor="middle">0</text><line x1="280.0" y1="452" x2="280.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="280.0" y="496" class="s" text-anchor="middle">1 s</text><line x1="410.0" y1="452" x2="410.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="410.0" y="496" class="s" text-anchor="middle">2 s</text><line x1="540.0" y1="452" x2="540.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="540.0" y="496" class="s" text-anchor="middle">3 s</text><line x1="670.0" y1="452" x2="670.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="670.0" y="496" class="s" text-anchor="middle">4 s</text><line x1="800.0" y1="452" x2="800.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="800.0" y="496" class="s" text-anchor="middle">5 s</text><line x1="930.0" y1="452" x2="930.0" y2="480" stroke="#eaeef2" stroke-width="1" stroke-dasharray="2 3"/><text x="930.0" y="496" class="s" text-anchor="middle">6 s</text><text x="48" y="522" class="s" text-anchor="start">关键差别：LED1 每 1 s 醒一次，LED2 每 3 s 醒一次，串口每 2 s 醒一次 —— 周期彼此独立，</text><text x="48" y="540" class="s" text-anchor="start" fill="#1a7f37">谁在「睡」都不影响别人，因为睡眠的是任务，不是 CPU。</text></svg>