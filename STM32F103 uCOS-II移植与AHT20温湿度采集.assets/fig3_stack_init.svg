<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="600" fill="#ffffff"/><defs><marker id="a1f2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker></defs><text x="40" y="34" class="title" text-anchor="start">图 3  OSTaskStkInit()：在栈里「伪造」一个中断现场</text><text x="40" y="58" class="s" text-anchor="start">任务第一次被调度时并不走函数调用，而是走「异常返回」——硬件从栈里弹出 8 个寄存器，PC 于是跳到了任务入口。</text><text x="292" y="78" class="s" text-anchor="end">高地址</text><rect x="300" y="88" width="310" height="25" rx="2" ry="2" fill="#ffebe9" stroke="#d0d7de" stroke-width="1"/><text x="288" y="105" class="m" text-anchor="end" fill="#cf222e" font-weight="600">xPSR</text><text x="314" y="105" class="m" text-anchor="start" fill="#cf222e">0x01000000</text><text x="626" y="105" class="s" text-anchor="start" fill="#cf222e">T 位 = 1（Thumb）；漏了立刻 HardFault</text><rect x="300" y="114" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="131" class="m" text-anchor="end" fill="#1f2328" font-weight="600">PC</text><text x="314" y="131" class="m" text-anchor="start" fill="#1f2328">任务入口地址</text><text x="626" y="131" class="s" text-anchor="start" fill="#57606a">就是 task 形参</text><rect x="300" y="140" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="157" class="m" text-anchor="end" fill="#1f2328" font-weight="600">LR</text><text x="314" y="157" class="m" text-anchor="start" fill="#1f2328">0xFFFFFFFE</text><text x="626" y="157" class="s" text-anchor="start" fill="#57606a">非法返回地址，跑飞时便于定位</text><rect x="300" y="166" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="183" class="m" text-anchor="end" fill="#1f2328" font-weight="600">R12</text><text x="314" y="183" class="m" text-anchor="start" fill="#1f2328">0</text><text x="626" y="183" class="s" text-anchor="start" fill="#57606a">硬件自动压栈区</text><rect x="300" y="192" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="209" class="m" text-anchor="end" fill="#1f2328" font-weight="600">R3</text><text x="314" y="209" class="m" text-anchor="start" fill="#1f2328">0</text><rect x="300" y="218" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="235" class="m" text-anchor="end" fill="#1f2328" font-weight="600">R2</text><text x="314" y="235" class="m" text-anchor="start" fill="#1f2328">0</text><rect x="300" y="244" width="310" height="25" rx="2" ry="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="261" class="m" text-anchor="end" fill="#1f2328" font-weight="600">R1</text><text x="314" y="261" class="m" text-anchor="start" fill="#1f2328">0</text><rect x="300" y="270" width="310" height="25" rx="2" ry="2" fill="#ddf4ff" stroke="#d0d7de" stroke-width="1"/><text x="288" y="287" class="m" text-anchor="end" fill="#0969da" font-weight="600">R0</text><text x="314" y="287" class="m" text-anchor="start" fill="#0969da">p_arg</text><text x="626" y="287" class="s" text-anchor="start" fill="#0969da">任务形参从这里传进去</text><rect x="300" y="296" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="313" class="m" text-anchor="end" fill="#57606a" font-weight="600">R11</text><text x="314" y="313" class="m" text-anchor="start" fill="#57606a">0</text><text x="626" y="313" class="s" text-anchor="start" fill="#57606a">软件手工保存区</text><rect x="300" y="322" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="339" class="m" text-anchor="end" fill="#57606a" font-weight="600">R10</text><text x="314" y="339" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="348" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="365" class="m" text-anchor="end" fill="#57606a" font-weight="600">R9</text><text x="314" y="365" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="374" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="391" class="m" text-anchor="end" fill="#57606a" font-weight="600">R8</text><text x="314" y="391" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="400" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="417" class="m" text-anchor="end" fill="#57606a" font-weight="600">R7</text><text x="314" y="417" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="426" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="443" class="m" text-anchor="end" fill="#57606a" font-weight="600">R6</text><text x="314" y="443" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="452" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="469" class="m" text-anchor="end" fill="#57606a" font-weight="600">R5</text><text x="314" y="469" class="m" text-anchor="start" fill="#57606a">0</text><rect x="300" y="478" width="310" height="25" rx="2" ry="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="288" y="495" class="m" text-anchor="end" fill="#57606a" font-weight="600">R4</text><text x="314" y="495" class="m" text-anchor="start" fill="#57606a">0</text><text x="288" y="529" class="s" text-anchor="end">低地址</text><line x1="614" y1="507" x2="614" y2="537" stroke="#1f2328" stroke-width="1"/><path d="M 614 537 l 56 0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a1f2328)"/><text x="678" y="541" class="s" text-anchor="start">返回给内核，存进 OSTCBStkPtr</text><text x="40" y="106" class="l" text-anchor="start" font-weight="600">OSTaskStkInit()</text><text x="40" y="130" class="s" text-anchor="start">从栈顶 ptos 往下</text><text x="40" y="148" class="s" text-anchor="start">写 16 个字，</text><text x="40" y="166" class="s" text-anchor="start">顺序不能错。</text><text x="40" y="388" class="l" text-anchor="start" fill="#cf222e" font-weight="600">★ 8 字节对齐</text><text x="40" y="410" class="m" text-anchor="start" fill="#cf222e">ptos &amp; 0xFFFFFFF8</text><text x="40" y="432" class="s" text-anchor="start">否则硬件插入填充，</text><text x="40" y="450" class="s" text-anchor="start">出栈就对不上，直接跑飞。</text><text x="40" y="558" class="s" text-anchor="start">PendSV_Handler 里的 STMDB R0!,{R4-R11} 保存的正是下半部分，LDMIA 恢复它；</text><text x="40" y="578" class="s" text-anchor="start">上半部分 8 个寄存器由硬件异常返回自动弹出 —— 这就是 Cortex-M 比 ARM7 好移植的原因。</text></svg>