<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="470" fill="#ffffff"/><text x="40" y="34" class="title" text-anchor="start">图 2  uC/OS-II 的移植边界：内核一行不改，只碰 4 个文件</text><text x="40" y="58" class="s" text-anchor="start">uC/OS-II 把「与 CPU 有关」的代码全部隔离在 PORTS 里，移植 = 把这 4 个文件按 Cortex-M3 重写。</text><rect x="30" y="76" width="620" height="84" rx="8" ry="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="46" y="100" class="l" text-anchor="start" fill="#0969da" font-weight="600">应用层  USER/main.c</text><text x="46" y="124" class="s" text-anchor="start">start_task / led1_task / led2_task / uart_task  ← 只写业务</text><text x="46" y="146" class="s" text-anchor="start">调用 OSTaskCreate()、OSTimeDly()、OSTimeGet() 这些 API</text><rect x="30" y="172" width="620" height="78" rx="8" ry="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="46" y="196" class="l" text-anchor="start" fill="#8250df" font-weight="600">内核层  UCOSII/SOURCE/*.c  （官方源码，一个字都不改）</text><text x="46" y="220" class="m" text-anchor="start">os_core.c  os_task.c  os_time.c  os_sem.c  os_q.c …</text><text x="46" y="240" class="s" text-anchor="start">TCB 管理、就绪表、延时链表、事件控制块、调度决策</text><rect x="30" y="262" width="620" height="108" rx="8" ry="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.4"/><text x="46" y="286" class="l" text-anchor="start" fill="#bc4c00" font-weight="600">移植层  UCOSII/PORTS/   ★ 本次要写的代码</text><text x="56" y="308" class="m" text-anchor="start" fill="#bc4c00">os_cpu.h</text><text x="186" y="308" class="s" text-anchor="start">数据类型 / 栈方向 / 临界区 / OS_TASK_SW</text><text x="56" y="329" class="m" text-anchor="start" fill="#bc4c00">os_cpu_c.c</text><text x="186" y="329" class="s" text-anchor="start">OSTaskStkInit() + SysTick 初始化</text><text x="56" y="350" class="m" text-anchor="start" fill="#bc4c00">os_cpu_a.asm</text><text x="186" y="350" class="s" text-anchor="start">OSStartHighRdy / OSCtxSw / PendSV / SysTick</text><rect x="30" y="382" width="620" height="62" rx="8" ry="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="46" y="406" class="xs" text-anchor="start" font-weight="600">硬件层  STM32F103 · Cortex-M3 · PRIMASK / PSP / MSP / SysTick / PendSV</text><text x="46" y="428" class="s" text-anchor="start">72 MHz · 1 ms 一个节拍（OS_TICKS_PER_SEC = 1000）</text><line x1="340" y1="160" x2="340" y2="171" stroke="#0969da" stroke-width="1.4"/><line x1="340" y1="250" x2="340" y2="261" stroke="#8250df" stroke-width="1.4"/><line x1="340" y1="370" x2="340" y2="381" stroke="#bc4c00" stroke-width="1.4"/><rect x="676" y="76" width="296" height="368" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="694" y="102" class="l" text-anchor="start" font-weight="600">移植要回答的 4 个问题</text><text x="696" y="134" class="l" text-anchor="start" fill="#0969da" font-weight="600">① 数据类型多大？</text><text x="696" y="154" class="s" text-anchor="start">char 8 / short 16 / int 32</text><text x="696" y="172" class="s" text-anchor="start" fill="#57606a">→ INT8U … INT32U</text><text x="696" y="212" class="l" text-anchor="start" fill="#0969da" font-weight="600">② 栈往哪边长？</text><text x="696" y="232" class="s" text-anchor="start">Cortex-M3 是满递减栈</text><text x="696" y="250" class="s" text-anchor="start" fill="#57606a">→ OS_STK_GROWTH = 1</text><text x="696" y="290" class="l" text-anchor="start" fill="#0969da" font-weight="600">③ 怎么关中断？</text><text x="696" y="310" class="s" text-anchor="start">保存并恢复 PRIMASK</text><text x="696" y="328" class="s" text-anchor="start" fill="#57606a">→ CRITICAL_METHOD 3</text><text x="696" y="368" class="l" text-anchor="start" fill="#0969da" font-weight="600">④ 怎么切任务？</text><text x="696" y="388" class="s" text-anchor="start">挂起 PendSV，最低优先级里切</text><text x="696" y="406" class="s" text-anchor="start" fill="#57606a">→ OS_TASK_SW()</text></svg>