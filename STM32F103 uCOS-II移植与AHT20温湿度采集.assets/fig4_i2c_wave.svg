<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="a1f2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker></defs><defs><marker id="acf222e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker></defs><defs><marker id="a1a7f37" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker></defs><text x="40" y="34" class="title" text-anchor="start">图 4  I2C 一次完整通信的波形：读 AHT20 时的地址字节 + 应答</text><text x="40" y="58" class="s" text-anchor="start">五个关键时刻：起始 S、数据位、应答 ACK、非应答 NACK、停止 P。数据只能在 SCL 低电平期间变化。</text><polyline points="70,104 172,104 172,152 190,152 224.1,152 224.1,104 252,104 252,152 252,152 286.1,152 286.1,104 314,104 314,152 314,152 348.1,152 348.1,104 376,104 376,152 376,152 410.1,152 410.1,104 438,104 438,152 438,152 472.1,152 472.1,104 500,104 500,152 500,152 534.1,152 534.1,104 562,104 562,152 562,152 596.1,152 596.1,104 624,104 624,152 624,152 658.1,152 658.1,104 686,104 686,152 686,152 720.1,152 720.1,104 748,104 748,152 794,152 794,104 854,104" fill="none" stroke="#0969da" stroke-width="2" stroke-linejoin="round"/><polyline points="70,206 150,206 150,254 190,254 190,254 252,254 252,254 252,206 314,206 314,206 314,206 376,206 376,206 376,206 438,206 438,206 438,254 500,254 500,254 500,254 562,254 562,254 562,254 624,254 624,254 624,206 686,206 686,206 686,254 748,254 794,254 794,254 820,254 820,206 854,206" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><text x="70" y="96" class="l" text-anchor="start" fill="#0969da" font-weight="600">SCL</text><text x="70" y="198" class="l" text-anchor="start" fill="#1f2328" font-weight="600">SDA</text><line x1="190" y1="80" x2="190" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="221.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A6</text><line x1="252" y1="80" x2="252" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="283.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A5</text><line x1="314" y1="80" x2="314" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="345.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A4</text><line x1="376" y1="80" x2="376" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="407.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A3</text><line x1="438" y1="80" x2="438" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="469.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A2</text><line x1="500" y1="80" x2="500" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="531.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A1</text><line x1="562" y1="80" x2="562" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="593.0" y="78" class="s" text-anchor="middle" fill="#1f2328">A0</text><line x1="624" y1="80" x2="624" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="655.0" y="78" class="s" text-anchor="middle" fill="#1f2328">R</text><line x1="686" y1="80" x2="686" y2="262" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="717.0" y="78" class="s" text-anchor="middle" fill="#1a7f37">ACK</text><line x1="150" y1="80" x2="150" y2="296" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="150" y="312" class="s" text-anchor="middle" fill="#cf222e" font-weight="600">S 起始</text><text x="202" y="312" class="s" text-anchor="start">地址字节 0x71 = 0111 0001（读）</text><line x1="820" y1="80" x2="820" y2="296" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="822" y="312" class="s" text-anchor="start" fill="#cf222e" font-weight="600">P 停止</text><text x="685.0" y="344" class="s" text-anchor="middle" fill="#1a7f37" font-weight="600">第 9 个时钟：主机释放 SDA，从机把它拉低 = ACK</text><line x1="661.0" y1="300" x2="661.0" y2="258" stroke="#1a7f37" stroke-width="1.2"/><path d="M 661.0 258 l 0 -6" stroke="#1a7f37" stroke-width="1.2" marker-end="url(#a1f23237)"/><text x="70" y="392" class="s" text-anchor="start">√ 数据在 SCL 低时改变、高时保持稳定；主机只在两个时刻「犯规」：起始（高电平下 SDA 下降）与停止（高电平下 SDA 上升）。</text><text x="70" y="412" class="s" text-anchor="start">√ 本工程每个电平保持 5 µs，SCL 周期约 10 µs ≈ 100 kHz，落在标准模式内，也远低于 AHT20 支持的 400 kHz 上限。</text></svg>