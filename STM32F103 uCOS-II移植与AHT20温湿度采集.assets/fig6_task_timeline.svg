<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><style>text{font-family:Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif;fill:#1f2328}.l{font-size:13.5px}.s{font-size:11.5px;fill:#57606a}.m{font-family:Consolas, Menlo, monospace;font-size:12px}.xs{font-size:10.5px}.title{font-size:16px;font-weight:600}</style><rect width="1000" height="500" fill="#ffffff"/><text x="40" y="34" class="title" text-anchor="start">图 6  三个任务的调度时间线（0~6 s）</text><text x="40" y="58" class="s" text-anchor="start">实心块 = 正在占用 CPU；竖线 = 唤醒时刻。sensor 任务每次采集有 80 ms 在等 AHT20，这 80 ms 里 CPU 归别人。</text><text x="158" y="118" class="s" text-anchor="end" fill="#1a7f37" font-weight="600">led1_task  P=5</text><line x1="170" y1="112" x2="930" y2="112" stroke="#d0d7de" stroke-width="1"/><line x1="170.0" y1="98" x2="170.0" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="170.0" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="296.6666666666667" y1="98" x2="296.6666666666667" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="296.6666666666667" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="423.33333333333337" y1="98" x2="423.33333333333337" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="423.33333333333337" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="550.0" y1="98" x2="550.0" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="550.0" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="676.6666666666667" y1="98" x2="676.6666666666667" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="676.6666666666667" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="803.3333333333334" y1="98" x2="803.3333333333334" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="803.3333333333334" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><line x1="930.0" y1="98" x2="930.0" y2="126" stroke="#1a7f37" stroke-width="1.2"/><rect x="930.0" y="104" width="17.733333333333334" height="16" rx="2" ry="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/><text x="158" y="176" class="s" text-anchor="end" fill="#bc4c00" font-weight="600">led2_task  P=6</text><line x1="170" y1="170" x2="930" y2="170" stroke="#d0d7de" stroke-width="1"/><line x1="170.0" y1="156" x2="170.0" y2="184" stroke="#bc4c00" stroke-width="1.2"/><rect x="170.0" y="162" width="17.733333333333334" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><line x1="550.0" y1="156" x2="550.0" y2="184" stroke="#bc4c00" stroke-width="1.2"/><rect x="550.0" y="162" width="17.733333333333334" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><line x1="930.0" y1="156" x2="930.0" y2="184" stroke="#bc4c00" stroke-width="1.2"/><rect x="930.0" y="162" width="17.733333333333334" height="16" rx="2" ry="2" fill="#bc4c00" stroke="#bc4c00" stroke-width="0"/><text x="158" y="234" class="s" text-anchor="end" fill="#0969da" font-weight="600">sensor_task P=7</text><line x1="170" y1="228" x2="930" y2="228" stroke="#d0d7de" stroke-width="1"/><line x1="170.0" y1="214" x2="170.0" y2="242" stroke="#0969da" stroke-width="1.2"/><rect x="170.0" y="220" width="17.733333333333334" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="423.33333333333337" y1="214" x2="423.33333333333337" y2="242" stroke="#0969da" stroke-width="1.2"/><rect x="423.33333333333337" y="220" width="17.733333333333334" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="676.6666666666667" y1="214" x2="676.6666666666667" y2="242" stroke="#0969da" stroke-width="1.2"/><rect x="676.6666666666667" y="220" width="17.733333333333334" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><line x1="930.0" y1="214" x2="930.0" y2="242" stroke="#0969da" stroke-width="1.2"/><rect x="930.0" y="220" width="17.733333333333334" height="16" rx="2" ry="2" fill="#0969da" stroke="#0969da" stroke-width="0"/><text x="158" y="292" class="s" text-anchor="end" fill="#57606a" font-weight="600">空闲任务  P=31</text><line x1="170" y1="286" x2="930" y2="286" stroke="#d0d7de" stroke-width="1"/><line x1="170.0" y1="88" x2="170.0" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="170.0" y="356" class="s" text-anchor="middle">0</text><line x1="296.6666666666667" y1="88" x2="296.6666666666667" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="296.6666666666667" y="356" class="s" text-anchor="middle">1 s</text><line x1="423.33333333333337" y1="88" x2="423.33333333333337" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="423.33333333333337" y="356" class="s" text-anchor="middle">2 s</text><line x1="550.0" y1="88" x2="550.0" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="550.0" y="356" class="s" text-anchor="middle">3 s</text><line x1="676.6666666666667" y1="88" x2="676.6666666666667" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="676.6666666666667" y="356" class="s" text-anchor="middle">4 s</text><line x1="803.3333333333334" y1="88" x2="803.3333333333334" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="803.3333333333334" y="356" class="s" text-anchor="middle">5 s</text><line x1="930.0" y1="88" x2="930.0" y2="336" stroke="#eaeef2" stroke-width="1" stroke-dasharray="3 3"/><text x="930.0" y="356" class="s" text-anchor="middle">6 s</text><text x="40" y="402" class="s" text-anchor="start" fill="#0969da">每次采样：发 0xAC → OSTimeDly(80) 挂起 → LED 任务 / 空闲任务接管 CPU → 80 拍后被唤醒 → 读 7 字节</text><text x="40" y="428" class="s" text-anchor="start" fill="#1a7f37">肉眼看到：一个灯 1 s 一闪、另一个 3 s 一闪、串口每 2 s 一行 —— 三者互不等待，这才叫并发。</text><text x="40" y="450" class="s" text-anchor="start" fill="#cf222e">若把 sensor 的等待换成 delay_ms(80) 死等，这 80 ms 内 1 s 的灯就会被拖住，节奏一眼能看出抖动。</text></svg>